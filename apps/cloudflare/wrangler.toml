name = "uzina"
main = "build/index.js"
compatibility_date = "2026-05-01"
workers_dev = false

[vars]
UZINA_MODEL_PROVIDER = "openai"
UZINA_MODEL_ID = "gpt-4o-mini"

[[durable_objects.bindings]]
name = "FACTORY"
class_name = "FactoryObject"

[[durable_objects.bindings]]
name = "MANAGED_WORK"
class_name = "ManagedWorkObject"

[[durable_objects.bindings]]
name = "PRIVATE_ASSISTANT"
class_name = "PrivateAssistantObject"

[[r2_buckets]]
binding = "CHECKPOINTS"
bucket_name = "uzina-workspace-checkpoints"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FactoryObject", "ManagedWorkObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PrivateAssistantObject"]
